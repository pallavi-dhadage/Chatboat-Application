apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatapp-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Enable WebSocket upgrade for Socket.IO
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  ingressClassName: nginx
  rules:
    - host: chatapp.example.com     # replace with your domain
      http:
        paths:
          # Flask REST API and Socket.IO
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: backend-flask
                port:
                  number: 5000
          - path: /socket.io/
            pathType: Prefix
            backend:
              service:
                name: backend-flask
                port:
                  number: 5000
          # Django Admin
          - path: /admin/
            pathType: Prefix
            backend:
              service:
                name: backend-django
                port:
                  number: 8000
          # React SPA (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
