apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-flask
  namespace: default
  labels:
    app: backend-flask
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-flask
  template:
    metadata:
      labels:
        app: backend-flask
    spec:
      containers:
        - name: backend-flask
          image: YOUR_ECR_REGISTRY/backend-flask:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: chatapp-config
            - secretRef:
                name: chatapp-secrets   # create with: kubectl create secret generic chatapp-secrets --from-env-file=.env
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
