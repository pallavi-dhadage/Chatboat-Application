worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 15M;   # allow up to 15 MB uploads (design limit is 10 MB)

    # ---------------------------------------------------------------------------
    # Upstream: Flask Chat_Service
    # ---------------------------------------------------------------------------
    upstream flask_backend {
        server backend-flask:5000;
        keepalive 32;
    }

    # ---------------------------------------------------------------------------
    # Upstream: Django Admin_Service
    # ---------------------------------------------------------------------------
    upstream django_backend {
        server backend-django:8000;
        keepalive 8;
    }

    # ---------------------------------------------------------------------------
    # Upstream: React Frontend (dev server or static nginx container)
    # ---------------------------------------------------------------------------
    upstream react_frontend {
        server frontend:3000;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        # Health check endpoint (used by docker healthcheck)
        location = /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # -----------------------------------------------------------------------
        # Flask REST API — /api/v1/*
        # -----------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # -----------------------------------------------------------------------
        # Socket.IO WebSocket upgrade — /socket.io/*
        # Requires Upgrade + Connection headers for WS handshake
        # -----------------------------------------------------------------------
        location /socket.io/ {
            proxy_pass         http://flask_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;  # keep WS connections alive
            proxy_send_timeout 3600s;
        }

        # -----------------------------------------------------------------------
        # Django Admin Panel — /admin/*
        # -----------------------------------------------------------------------
        location /admin/ {
            proxy_pass         http://django_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Django static files (admin CSS/JS)
        location /static/admin/ {
            proxy_pass http://django_backend;
        }

        # -----------------------------------------------------------------------
        # React SPA — everything else falls through to the frontend
        # -----------------------------------------------------------------------
        location / {
            proxy_pass         http://react_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Support React Router (HTML5 history mode) — return index.html for
            # unknown paths so client-side routing works correctly
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }
}
